version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: smartanketa_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calculation_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartanketa_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartanketa_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: calculation_db
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - smartanketa_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  smartanketa_network:
    driver: bridge