apiVersion: v1
kind: Service
metadata:
  name: {{ include "smart-anketa-frontend.fullname" . }}
  labels: {{- include "smart-anketa-frontend.labels" . | nindent 4 }}
spec:
  ports:
    - name: 8080-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: {{ include "smart-anketa-frontend.fullname" . }}
