# Default values for smart-anketa-api.

pullSecret: ci-dos

replicaCount: 1

image:
  repository: nexus-ci.corp.dev.vtb/sumd-docker-lib/smart-anketa-api
  tag: v1.0.0
  pullPolicy: Always

auditSidecar:
  enabled: false
  name: audit-proxy
  image:
    repository: ""
    tag: v1.0.17
    pullPolicy: Always
  ports: []
  readinessProbe:
    tcpSocket:
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    tcpSocket:
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  env:
    SPRING_PROFILES_ACTIVE: dev
    KAFKA_BOOTSTRAP_SERVERS: omni1-emulator-kafka:9092
    MS_PROPERTIES_INFO_SYSTEM_CODE: SUMD
    MS_PROPERTIES_INFO_SYSTEM_ID: "1661"
  extraEnv: []
  volumeMounts: []
  volumes: []
  resources: {}

extraEnv: []
extraVolumes: []

resources:
  requests:
    cpu: "300m"
    memory: "1000Mi"
  limits:
    cpu: "600m"
    memory: "2000Mi"

secretName: ingress-tls

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: smart-anketa-api-ds1-lpad01-sumd-team-sumcore-system.apps.ds1-lpad01.corp.dev.vtb
      paths:
        - pathType: ImplementationSpecific
          backend:
            service:
              name: smart-anketa-api
              port:
                number: 3000
  tls:
    - secretName: ingress-tls
      hosts:
        - smart-anketa-api-ds1-lpad01-sumd-team-sumcore-system.apps.ds1-lpad01.corp.dev.vtb


###Выбор worker ноды без GPU
affinity:
  enabled: false
#  nodeAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#      nodeSelectorTerms:
#        - matchExpressions:
#            - key: nvidia.com/gpu.product
#              operator: DoesNotExist

### Выбор политики для автоскалирования количества подов - разкомментить требуемое
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  # targetCPUUtilizationPercentage: 80
  # targetCPUAverageValue: 100m
  # targetMemoryUtilizationPercentage: 80
  # targetMemoryAverageValue: 200Mi

secrets:
  immutable:
    enabled: false

env:
 DB_HOST: d5sumd-pgc001lk.corp.dev.vtb
 DB_PORT: 5432
 DB_NAME: sumd
 NODE_ENV: production
 DB_SYNCHRONIZE: "false"
 DB_MIGRATIONS_RUN: "true"
 KEYCLOAK_URL: https://keycloak-sumd.sumd.dk1-sumd01.innodev.local/auth/
 KEYCLOAK_REALMS: cym
 KEYCLOAK_CLIENT: frontend
 NODE_TLS_REJECT_UNAUTHORIZED: 0
 PORT: 3000

secret:
 DB_USERNAME: "sum_user"
 DB_PASSWORD: "sum_user_pass"
 SESSION_SECRET: "my-secret"
